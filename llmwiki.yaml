# llmwiki 설정 (선택). 비워 두면 기본값으로 동작합니다.
zotero:
  # 시도 순서: 로컬 API(Zotero 실행 중) → sqlite 사본(Zotero 데이터 폴더) → 외부 Zotero CLI
  order: [local_api, sqlite, external]
  local_api_url: "http://127.0.0.1:23119/api"
  data_dir: ""          # 비우면 자동(~/Zotero, prefs.js). 예: "D:/Zotero"
  practice_collection: "llmwiki-practice"   # doctor가 이 컬렉션과 PDF 수를 확인(실습용)
  # 외부 Zotero CLI 연결 자리(선택). {query} {collection} {tag} {limit} {key} 가 치환됩니다.
  # 명령은 표준출력으로 JSON을 내야 합니다. 예시는 README의 'Zotero CLI 연결' 참고.
  external_cli:
    search: ""
    get: ""
    collections: ""
network:
  enabled: true         # false면 Crossref/arXiv/OpenAlex 보강을 하지 않음(오프라인 강의실)
  timeout: 12
  mailto: ""            # Crossref 예절용 이메일(선택)
related:
  top_k: 5              # 논문당 관련 논문 후보 수
  min_score: 0.0        # TF-IDF 코사인 최소값(논문이 많아지면 0.05 정도로 올려 보세요)
